name: triton-distributed-pre-merge-ci
trigger:
  change:
    types: [ create, push ]
    notification:
      when: [ success, failure ]
jobs:
  triton-amd-pre-merge:
    name: Triton-distributed CI for amd backend.
    image: rocm/bytedance-private:bkc24.13_torch2.5.1_ub22.04_aterV4
    envs:
      PYTHONPATH: $PYTHONPATH:/home/code/python:/home/code/shmem/rocshmem_bind/python/
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:/home/code/shmem/rocshmem_bind/ompi_build/install/ompi/lib
      http_proxy: http://sys-proxy-rd-relay.byted.org:3128
      https_proxy: http://sys-proxy-rd-relay.byted.org:3128
      PATH: /home/code/.local/bin:$PATH
    runs-on:
      cluster: triton_distributed_amd_109

    steps:
      - name: code-format-check
        commands:
          - pip3 install ninja black "clang-format==19.1.2" pre-commit ruff yapf==0.43
          - pip3 install pytest
          - pip3 install chardet
          # - pre-commit run ruff --from-ref=${{Event.Change.Target.SHA}} --to-ref=${{Event.Change.Source.SHA}} --show-diff-on-failure
          # - pre-commit run yapf --from-ref=${{Event.Change.Target.SHA}} --to-ref=${{Event.Change.Source.SHA}} --show-diff-on-failure
          - ./code-format.sh --show-only --fail-on-diff --target ${{Event.Change.Source.SHA}} --base ${{Event.Change.Target.SHA}}
          - python3 scripts/check_license.py

      - name: build
        commands:
          - python3 -m pip install cmake==3.26 ninja wheel lit numpy plotly pandas pytest scipy==1.10.1 matplotlib tabulate pybind11 setuptools==69.0.0 tqdm
          - python3 -m pip install -i https://test.pypi.org/simple hip-python>=6.3.0
          - git submodule update --init --recursive
          # some unknown proxy issue caused apt install fail for some packages
          - unset http_proxy
          - bash shmem/rocshmem_bind/build.sh
          - export http_proxy=http://sys-proxy-rd-relay.byted.org:3128
          - MAX_JOBS=126 pip3 install -e python --verbose --no-build-isolation --use-pep517

      - name: distributed tests
        commands:
          # distributed ops
          - bash ./scripts/launch_amd.sh ./python/triton_dist/test/amd/test_distributed-notify-wait.py
          # ag gemm
          - bash ./scripts/launch_amd.sh ./python/triton_dist/test/amd/test_ag_gemm_intra_node.py 8192 11008 4096
          # gemm rs
          - bash ./scripts/launch_amd.sh ./python/triton_dist/test/amd/test_gemm_rs_intra_node.py 8192 4096 12288
          # tutorials
          # 09
          - bash ./scripts/launch_amd.sh ./tutorials/09-AMD-overlapping-allgather-gemm.py
          # 10
          - bash ./scripts/launch_amd.sh ./tutorials/10-AMD-overlapping-gemm-reduce-scatter.py

  triton-nvidia-pre-merge:
    image: hub.byted.org/compile/data.aml.flux_compile:cu124-py311-torch24-241101-3
    envs:
      PYTHONPATH: $PYTHONPATH:/home/code/python
      LD_LIBRARY_PATH: /home/code/3rdparty/nvshmem/build/install/lib:$LD_LIBRARY_PATH
      http_proxy: http://sys-proxy-rd-relay.byted.org:3128
      https_proxy: http://sys-proxy-rd-relay.byted.org:3128
      PATH: /home/code/.local/bin:$PATH
    runs-on:
      cluster: triton_distributed_nvidia_121
      docker:
        shared-memory: 1024

    steps:
      - name: code-format-check
        commands:
          - pip3 install ninja black "clang-format==19.1.2" pre-commit ruff yapf==0.43 setuptools==69.0.0
          - pip3 install cuda-python==12.4
          - pip3 install pynvml==11.5.3
          - pip3 install pytest
          - pip3 install chardet
          # - pre-commit run ruff --from-ref=${{Event.Change.Target.SHA}} --to-ref=${{Event.Change.Source.SHA}} --show-diff-on-failure
          # - pre-commit run yapf --from-ref=${{Event.Change.Target.SHA}} --to-ref=${{Event.Change.Source.SHA}} --show-diff-on-failure
          - ./code-format.sh --show-only --fail-on-diff --target ${{Event.Change.Source.SHA}} --base ${{Event.Change.Target.SHA}}
          - python3 scripts/check_license.py

      - name: env-check
        commands:
          - nvidia-smi
          - curl -IivvL https://oaitriton.blob.core.windows.net/public/llvm-builds/
          - mkdir -p /home/code/.local/bin
          - ln -s `which python3` /home/code/.local/bin/python
          - ln -s `which pip3` /home/code/.local/bin/pip
          - hash -r
          - python3 --version
          - pip3 --version
          - python3 -c "import torch; print(torch.__version__)"

      - name: build
        commands:
          - git submodule update --init --recursive
          - pip3 install ninja cmake wheel pybind11
          - export USE_TRITON_DISTRIBUTED_AOT=0
          - MAX_JOBS=126 pip3 install -e python --verbose --no-build-isolation --use-pep517
          - bash ./scripts/gen_aot_code.sh
          - export USE_TRITON_DISTRIBUTED_AOT=1
          - MAX_JOBS=126 pip3 install -e python --verbose --no-build-isolation --use-pep517
      - name: build_wheel
        commands:
          - cd python
          - python3 setup.py bdist_wheel
          - cd ..
      - name: unit tests
        commands:
          - python3 ./python/triton_dist/test/nvidia/test_language_extra.py
      - name: simt and basic tests
        commands:
          #############
          # ad-hoc test
          #############
          # simt
          - python3 ./python/triton_dist/test/nvidia/test_simt.py
          # basic
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_distributed_wait.py --case correctness
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_distributed_wait.py --case correctness_tma
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_distributed_wait.py --case correctness_tma_multi_barrier
      - name: aot compile tests
        commands:
          # aot compilation
          - USE_TRITON_DISTRIBUTED_AOT=1 bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_compile_aot.py
      - name: ag gemm tests
        commands:
          # ag gemm
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_ag_gemm.py --case correctness
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_ag_gemm.py --case correctness_autotune
      - name: gemm rs tests
        commands:
          # - CUBLAS_WORKSPACE_CONFIG=":16:8" bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_ag_gemm_inter_node.py --M 80 # very small and not perfect shape
          # gemm rs
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_gemm_rs.py 8192 8192 29568
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_gemm_rs.py 8192 8192 29568 --check
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_gemm_rs.py 4096 4096 12288 --fuse_scatter --check
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_gemm_rs.py 4096 4096 12288 --fuse_scatter --no-persistent --check
      - name: allgather tests
        commands:
          # allgather
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_ag_small_msg.py
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_all_gather.py
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_fast_allgather.py   --iters 10   --warmup_iters 20   --mode push_2d_ll   --minbytes 4096   --maxbytes 8192
      - name: ep all2all inference tests
        commands:
          # all-to-all
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_all_to_all.py
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_ep_moe_inference.py
      - name: nvshmem api tests
        commands:
          # nvshmem related
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_nvshmem_api.py
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_ring_put.py
      - name: flash decoding tests
        commands:
          # flash decoding
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_decode_attn.py --case perf_8k
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_decode_attn.py --case perf_8k_persistent
          - USE_TRITON_DISTRIBUTED_AOT=1 bash ./scripts/launch.sh  ./python/triton_dist/test/nvidia/test_decode_attn.py --case perf_8k_persistent_aot
          - USE_TRITON_DISTRIBUTED_AOT=1 bash ./scripts/launch.sh  ./python/triton_dist/test/nvidia/test_decode_attn.py --case perf_8k_aot
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_sp_decode_attn.py --case perf
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_sp_decode_attn.py --case correctness
          - USE_TRITON_DISTRIBUTED_AOT=1 bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_sp_decode_attn.py --case correctness
      - name: ag moe tests
        commands:
          # ag moe
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_ag_moe.py --M 2048 --iters 10 --warmup_iters 20
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_ag_moe.py --M 2048 --iters 10 --warmup_iters 20 --autotune
      - name: moe rs tests
        commands:
          # moe rs
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_moe_reduce_rs.py 8192 2048 1536 32 2
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_moe_reduce_rs.py 8192 2048 1536 32 2 --autotune
      - name: ep all2all train tests
        commands:
          # ep a2a
          - NVSHMEM_SYMMETRIC_SIZE=10000000000 bash ./scripts/launch.sh  ./python/triton_dist/test/nvidia/test_ep_a2a.py -M 8192 -N 7168 --topk 8 --check
          - NVSHMEM_SYMMETRIC_SIZE=10000000000 bash ./scripts/launch.sh  ./python/triton_dist/test/nvidia/test_ep_a2a.py -M 8192 -N 7168 --topk 8
      - name: sp ag attention tests
        commands:
          # sp ag attn
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_sp_ag_attention_intra_node.py --batch_size 1 --q_head 32 --kv_head 32 --max_seqlen_q 8192 --max_seqlen_k 8192 --head_dim 128 --seqlens_q 8192 --seqlens_k 8192
      - name: allreduce tests
        commands:
          # allreduce
          - NVSHMEM_DISABLE_CUDA_VMM=1 bash ./scripts/launch.sh python/triton_dist/test/nvidia/test_allreduce.py --method double_tree --simulate_straggler --stress
          - NVSHMEM_DISABLE_CUDA_VMM=1 bash ./scripts/launch.sh python/triton_dist/test/nvidia/test_allreduce.py --method one_shot_non_tma --simulate_straggler --stress
          - NVSHMEM_DISABLE_CUDA_VMM=1 bash ./scripts/launch.sh python/triton_dist/test/nvidia/test_allreduce.py --method one_shot_tma --simulate_straggler --stress
          - NVSHMEM_DISABLE_CUDA_VMM=0 bash ./scripts/launch.sh python/triton_dist/test/nvidia/test_allreduce.py --method one_shot_ld_reduce --simulate_straggler --stress
          - NVSHMEM_DISABLE_CUDA_VMM=0 bash ./scripts/launch.sh python/triton_dist/test/nvidia/test_allreduce.py --method two_shot_ld_reduce --simulate_straggler --stress
          #############
          # pytest (disabled)
          #############
          # flash decoding
          # - pytest ./python/triton_dist/test/nvidia/test_decode_attn.py::test_triton_decode_with_paged_kv
          # - pytest ./python/triton_dist/test/nvidia/test_decode_attn.py::test_triton_decode_with_paged_kv_persistent
          # - USE_TRITON_DISTRIBUTED_AOT=1 pytest ./python/triton_dist/test/nvidia/test_decode_attn.py::test_triton_decode_with_paged_kv_persistent_aot
          ############
      - name: tutorial tests
        commands:
          # tutorials
          # 01
          - bash ./scripts/launch.sh ./tutorials/01-distributed-notify-wait.py
          # 02
          - bash ./scripts/launch.sh ./tutorials/02-intra-node-allgather.py
          # 03
          - bash ./scripts/launch.sh ./tutorials/03-inter-node-allgather.py
          # 04
          - bash ./scripts/launch.sh ./tutorials/04-deepseek-infer-all2all.py
          # 05
          - bash ./scripts/launch.sh ./tutorials/05-intra-node-reduce-scatter.py
          # 06
          - bash ./scripts/launch.sh ./tutorials/06-inter-node-reduce-scatter.py
          # 07
          - bash ./scripts/launch.sh ./tutorials/07-overlapping-allgather-gemm.py
          # 08
          - bash ./scripts/launch.sh ./tutorials/08-overlapping-gemm-reduce-scatter.py

      - name: e2e tests
        commands:
          - bash ./scripts/build_e2e_env.sh
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_mlp.py --M 4096 --model Qwen/Qwen3-32B
          - NVSHMEM_DISABLE_CUDA_VMM=0 bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_mlp.py --M 128 --model Qwen/Qwen3-32B --ar_method two_shot_ld_reduce
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_attn.py --bsz 32 --seq_len 128 --model Qwen/Qwen3-32B --mode prefill
          - NVSHMEM_DISABLE_CUDA_VMM=0 bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_attn.py --bsz 1 --seq_len 128 --model Qwen/Qwen3-32B --mode prefill --ar_method two_shot_ld_reduce
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_attn.py --bsz 4096 --seq_len 128 --model Qwen/Qwen3-32B --mode decode
          - NVSHMEM_DISABLE_CUDA_VMM=0 bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_attn.py --bsz 128 --seq_len 128 --model Qwen/Qwen3-32B --mode decode --ar_method two_shot_ld_reduce
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_e2e.py --bsz 8 --seq_len 256 --model Qwen/Qwen3-32B --check
          - NVSHMEM_DISABLE_CUDA_VMM=0 bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_e2e.py --bsz 8 --seq_len 128 --model Qwen/Qwen3-32B --check --ar_method two_shot_ld_reduce
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_e2e.py --bsz 32 --seq_len 128 --model Qwen/Qwen3-32B --mode prefill
          - NVSHMEM_DISABLE_CUDA_VMM=0 bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_e2e.py --bsz 1 --seq_len 128 --model Qwen/Qwen3-32B --mode prefill --ar_method two_shot_ld_reduce
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_e2e.py --bsz 4096 --seq_len 128 --model Qwen/Qwen3-32B --mode decode
          - NVSHMEM_DISABLE_CUDA_VMM=0 bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_tp_e2e.py --bsz 128 --seq_len 128 --model Qwen/Qwen3-32B --mode decode --ar_method two_shot_ld_reduce
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_e2e_inference.py --bsz 4096 --gen_len 128 --max_length 150
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_e2e_inference.py --bsz 4096 --gen_len 128 --max_length 150 --triton_dist
          - bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_e2e_inference.py --bsz 128 --gen_len 128 --max_length 150
          - NVSHMEM_DISABLE_CUDA_VMM=0 bash ./scripts/launch.sh ./python/triton_dist/test/nvidia/test_e2e_inference.py --bsz 128 --gen_len 128 --max_length 150 --triton_dist_AR
