      MAX_JOBS: 16
    steps:
      - name: build
        commands:
          - bash -x .codebase/scripts/nvidia/build.sh

  triton-compile-nvcr-io-nvidia-torch-23.04-py3:
    image: hub.byted.org/compile/nvcr.io.nvidia_pytorch:23.04-py3-20250724
    envs:
      PYTHONPATH: $PYTHONPATH:/home/code/python
      http_proxy: http://sys-proxy-rd-relay.byted.org:3128
      https_proxy: http://sys-proxy-rd-relay.byted.org:3128
      PATH: /home/code/.local/bin:$PATH
      MAX_JOBS: 16
    steps:
      - name: build
        commands:
          # - bash -x .codebase/scripts/nvidia/build.sh
          - echo "build with python 3.8 is not supported"
