  # ===================================================================
  # NVIDIA Jobs
  # ===================================================================
  triton-nvidia-H800-e2e:
    name: H800 E2E Tests
    image: hub.byted.org/compile/data.aml.flux_compile:cu124-py311-torch24-241101-3
    envs:
      PYTHONPATH: $PYTHONPATH:/home/code/python
      http_proxy: http://sys-proxy-rd-relay.byted.org:3128
      https_proxy: http://sys-proxy-rd-relay.byted.org:3128
      PATH: /home/code/.local/bin:$PATH
    runs-on:
      cluster: gpu-h100
      docker:
        shared-memory: 1024
    steps:
      - name: "Pre-flight Check"
        commands:
          - |
            export PLATFORM="nvidia"
            export JOB_TYPE="e2e"
            export BASE_SHA=${{Event.Change.Target.SHA}}
            export HEAD_SHA=${{Event.Change.Source.SHA}}
            python3 .codebase/scripts/pre_flight_check.py > ci_decision.txt
            echo "--- Pre-flight check complete. Decision: $(cat ci_decision.txt) ---"
      - name: code-format-check
        commands:
          - bash .codebase/scripts/run_step.sh "pip3 install black 'clang-format==20.1.8' pre-commit ruff yapf==0.43 chardet"
          - bash .codebase/scripts/run_step.sh "./code-format.sh --show-only --fail-on-diff --target ${{Event.Change.Source.SHA}} --base ${{Event.Change.Target.SHA}}"
          - bash .codebase/scripts/run_step.sh "python3 scripts/check_license.py"
      - name: env-check
        commands:
          - nvidia-smi
          - curl -IivvL https://oaitriton.blob.core.windows.net/public/llvm-builds/
          - mkdir -p /home/code/.local/bin
          - ln -s `which python3` /home/code/.local/bin/python
          - ln -s `which pip3` /home/code/.local/bin/pip
          - hash -r
          - python3 --version
          - pip3 --version
          - python3 -c "import torch; print(torch.__version__)"
      - name: build
        commands:
          - |
            bash .codebase/scripts/run_step.sh "
              set -e
              git submodule update --init --recursive
              pip3 install cuda-python==12.4 setuptools==69.0.0 wheel pybind11
              export USE_TRITON_DISTRIBUTED_AOT=0
              echo 'numpy<2' > /tmp/pip_install_constraint.txt
              MAX_JOBS=126 pip3 install -c /tmp/pip_install_constraint.txt -e python[build,tests,tutorials] --verbose --no-build-isolation --use-pep517
              bash ./scripts/gen_aot_code.sh
              export USE_TRITON_DISTRIBUTED_AOT=1
              MAX_JOBS=126 pip3 install -e python --verbose --no-build-isolation --use-pep517
            "
      - name: build_wheel
        commands:
          - |
            bash .codebase/scripts/run_step.sh "
              cd python
              python3 setup.py bdist_wheel
              cd ..
            "
      - name: e2e tests
        commands:
          - |
            bash .codebase/scripts/run_step.sh "
              set -e
              export http_proxy=http://sys-proxy-rd-relay.byted.org:3128 https_proxy=http://sys-proxy-rd-relay.byted.org:3128 no_proxy=code.byted.org
              wget https://tosv.byted.org/obj/hanshi-cn/hf_configs.zip
              unzip hf_configs.zip -d .codebase/
              wget https://tosv.byted.org/obj/hanshi-cn/flashinfer_python-0.2.5%2Bcu124torch2.4-cp38-abi3-linux_x86_64.whl
              bash ./scripts/build_e2e_env.sh
              bash -x .codebase/scripts/nvidia/run_e2e_test.sh
